name: AASRITI Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-and-architecture:
    name: Security & Architecture Integrity Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Secret Detection Scan
        run: |
          echo "Scanning for accidental committed secrets or private keys..."
          # Check for forbidden private key extensions or .env files
          FORBIDDEN_FILES=$(find . -type f \( -name "*.env" -o -name "*.keystore" -o -name "*.jks" -o -name "*.p12" -o -name "id_rsa" \) ! -name ".env.example")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "ERROR: Discovered unencrypted secret file(s) committed in Git:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "Secret scan passed: zero credential files detected."

      - name: UI Governance & Token Integrity
        run: |
          echo "Verifying presence of AASRITI UI Governance files..."
          test -f UI_RULES.md || { echo "Missing UI_RULES.md"; exit 1; }
          test -f UI_SCREEN_SPEC.md || { echo "Missing UI_SCREEN_SPEC.md"; exit 1; }
          test -f UI_COMPONENT_RULES.md || { echo "Missing UI_COMPONENT_RULES.md"; exit 1; }
          test -f UI_HERITAGE_GUIDE.md || { echo "Missing UI_HERITAGE_GUIDE.md"; exit 1; }
          test -f UI_ACCESSIBILITY_RULES.md || { echo "Missing UI_ACCESSIBILITY_RULES.md"; exit 1; }
          test -f SECURITY.md || { echo "Missing SECURITY.md"; exit 1; }
          echo "All constitutional governance files verified."

  ml-and-backend-validation:
    name: ML Engine & Python Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Train & Validate Decision Tree JSON Export
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn numpy
          python scripts/train_decision_tree.py
          test -f assets/ml/decision_tree_difficulty.json || { echo "Decision tree export failed"; exit 1; }
          echo "On-device Decision Tree runtime exported and verified successfully."

  android-build-and-test:
    name: Native Android Build & Unit Tests
    runs-on: ubuntu-latest
    needs: [security-and-architecture, ml-and-backend-validation]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
