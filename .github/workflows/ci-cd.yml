name: SmritiSetu CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: LINT & TYPE CHECK (FAST FAIL)
  # ----------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type Check (Mobile & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile-app/package.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile-app
          npm ci

      - name: Lint Mobile TypeScript
        run: |
          cd mobile-app
          npm run lint

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint Backend Python
        run: |
          cd backend
          ruff check .

  # ----------------------------------------------------------------------------
  # JOB 2: UNIT & CLINICAL ALGORITHM TESTS
  # ----------------------------------------------------------------------------
  unit-tests:
    name: Unit & Clinical Scoring Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mobile Dependencies
        run: |
          cd mobile-app
          npm ci

      - name: Run Jest Unit Tests (Clinical Scoring & Redux)
        run: |
          cd mobile-app
          npm test -- --coverage

  # ----------------------------------------------------------------------------
  # JOB 3: ANDROID APK PRE-FLIGHT BUILD VALIDATION
  # ----------------------------------------------------------------------------
  build-android-apk:
    name: Build Android APK (Offline Bundle)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: |
          cd mobile-app
          npm ci

      - name: Validate Expo Config & Prebuild
        run: |
          cd mobile-app
          npx expo config --type public
