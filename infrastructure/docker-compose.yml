version: '3.8'

# ==============================================================================
# SMRITISETU (SIH26003) - LOCAL DEVELOPER INFRASTRUCTURE STACK
# Launches PostgreSQL 16 + Redis 7 + FastAPI Gateway via `docker compose up -d`
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database with TimescaleDB Extension (Longitudinal Telemetry)
  # ----------------------------------------------------------------------------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: smritisetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smritisetu_user
      POSTGRES_PASSWORD: smritisetu_secure_pass_2025
      POSTGRES_DB: smritisetu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smritisetu_user -d smritisetu_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smritisetu-net

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache (Idempotency Key Deduplication & Session Tokens)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smritisetu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - smritisetu-net

  # ----------------------------------------------------------------------------
  # FastAPI Cloud Synchronization Gateway
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smritisetu-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://smritisetu_user:smritisetu_secure_pass_2025@postgres:5432/smritisetu_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=4a8b79f982d61a3294c7b8e104938102948b7c6d5e4f3a2b1c0d9e8f7a6b5c4d
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    networks:
      - smritisetu-net

volumes:
  postgres_data:
    name: smritisetu_postgres_data
  redis_data:
    name: smritisetu_redis_data

networks:
  smritisetu-net:
    name: smritisetu-network
    driver: bridge
