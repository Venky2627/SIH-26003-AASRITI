name: SmritiSetu CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check (Mobile & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile-app/package.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile-app
          npm ci

      - name: Lint Mobile TypeScript
        run: |
          cd mobile-app
          npm run lint

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint Backend Python
        run: |
          cd backend
          ruff check .

  unit-tests:
    name: Unit & Clinical Scoring Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Mobile Dependencies
        run: |
          cd mobile-app
          npm ci

      - name: Run Jest Unit Tests (Clinical Scoring & Redux)
        run: |
          cd mobile-app
          npm test -- --coverage
