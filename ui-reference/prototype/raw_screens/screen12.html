<script>
  (function() {
    const cards = document.querySelectorAll('.market-choice');
    cards.forEach((card) => {
      card.addEventListener('click', () => {
        cards.forEach((c) => {
          c.setAttribute('aria-checked', 'false');
          c.className = 'market-choice relative flex items-center p-space-sm rounded-xl bg-surface-container-lowest text-on-surface shadow-sm cursor-pointer transition-all active:scale-[0.99]';
          const title = c.querySelector('p');
          if (title) title.className = 'font-title-lg text-title-lg truncate text-on-surface';
          const iconContainer = c.querySelector('div:last-child');
          if (iconContainer) {
            iconContainer.className = 'w-11 h-11 rounded-full bg-surface-container text-outline flex items-center justify-center shrink-0 opacity-40';
            iconContainer.innerHTML = '<span class="material-symbols-outlined text-headline-sm">radio_button_unchecked</span>';
          }
        });

        card.setAttribute('aria-checked', 'true');
        card.className = 'market-choice relative flex items-center p-space-sm rounded-xl bg-primary-container text-on-primary shadow-md cursor-pointer transition-all';
        const activeTitle = card.querySelector('p');
        if (activeTitle) activeTitle.className = 'font-title-lg text-title-lg truncate text-on-primary';
        const activeIconContainer = card.querySelector('div:last-child');
        if (activeIconContainer) {
          activeIconContainer.className = 'w-11 h-11 rounded-full bg-surface-container-lowest text-primary-container flex items-center justify-center shadow-sm shrink-0';
          activeIconContainer.innerHTML = '<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: \'FILL\' 1;">check</span>';
        }
      });
    });
  })();
