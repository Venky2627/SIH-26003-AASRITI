  </head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col w-full bg-surface"><div class="flex flex-col w-full px-margin-mobile pb-space-2xl">
<!-- Spiral Motif Ambient Vignette Inspired by AASRITI Emblem -->
<div class="flex flex-col items-center pt-space-md pb-space-sm text-center">
<div class="relative w-20 h-20 mb-space-xs flex items-center justify-center">
<!-- Spiral Handcrafted Vector Illustration -->
<svg class="w-20 h-20 text-primary animate-pulse" fill="none" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
<path d="M60 62C58.5 59 62 55 65 57C69 60 67 67 62 69C54 72 47 63 51 54C56 42 72 41 80 52C90 65 80 84 66 89C48 95 32 77 36 57C41 33 67 22 89 31C112 42 118 73 103 97C96 108 82 113 70 115" stroke="#720227" stroke-dasharray="2 3" stroke-linecap="round" stroke-width="4.5"></path>
<circle cx="60" cy="60" fill="#fdb967" r="6"></circle>
<path d="M60 48V44M70 51L73 48M50 51L47 48" stroke="#865304" stroke-linecap="round" stroke-width="2.5"></path>
</svg>
<div class="absolute inset-0 bg-secondary-container/20 rounded-full blur-xl -z-10"></div>
</div>
<!-- Title & Gentle Audio Speaker Aid -->
<div class="flex items-center justify-center gap-space-xs">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Choose Language</h1>
<button aria-label="Tap to listen to instructions" class="w-11 h-11 flex items-center justify-center rounded-full bg-secondary-fixed text-on-secondary-fixed shadow-sm active:scale-95 transition-transform" id="btn-main-listen" type="button">
<span class="material-symbols-outlined text-title-lg" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
<!-- Reassuring Audio Prompt Badge -->

</div>
<!-- Language Option Cards -->
<div aria-label="Language options" class="flex flex-col gap-space-md mt-space-sm" role="radiogroup">
<!-- Card 1: Assamese (Active / Selected State) -->
<div aria-checked="true" class="group relative flex flex-col p-space-lg rounded-xl bg-surface-container-lowest shadow-md cursor-pointer transition-all active:scale-[0.99] select-none" id="lang-as" role="radio" tabindex="0">
<!-- Warm accent frame for selected item -->
<div class="absolute inset-0 rounded-xl bg-primary/5 pointer-events-none"></div>
<div class="flex items-center justify-between gap-space-sm relative z-10">
<!-- Text Group -->
<div class="flex flex-col min-w-0"><span class="font-headline-md text-headline-md text-primary font-semibold">অসমীয়া</span><span class="font-body-sm text-body-sm text-on-surface-variant mt-space-xxs">Assamese</span></div>
<!-- Controls: Audio Sample & Selected Checkmark -->
<div class="flex items-center gap-space-sm shrink-0">
<!-- Audio Sample Button -->
<button aria-label="Play Assamese sample sound" class="w-12 h-12 rounded-full bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center active:scale-90 transition-transform shadow-sm" onclick="event.stopPropagation(); playAudioPreview('as')" type="button">
<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: 'FILL' 1;">campaign</span>
</button>
<!-- Checkmark Stamp Badge -->
<div class="w-9 h-9 rounded-full bg-primary-container text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-title-md font-bold">check</span>
</div>
</div>
</div>
<!-- Tactile Card Footer Pill -->

</div>
<!-- Card 2: English (Unselected State) -->
<div aria-checked="false" class="group relative flex flex-col p-space-lg rounded-xl bg-surface-container-low shadow-sm cursor-pointer transition-all active:scale-[0.99] select-none opacity-90" id="lang-en" role="radio" tabindex="0">
<div class="flex items-center justify-between gap-space-sm relative z-10">
<!-- Text Group -->
<div class="flex flex-col min-w-0"><span class="font-headline-md text-headline-md text-on-surface font-semibold">English</span><span class="font-body-sm text-body-sm text-on-surface-variant mt-space-xxs">English</span></div>
<!-- Controls: Audio Sample & Radio Check Spot -->
<div class="flex items-center gap-space-sm shrink-0">
<!-- Audio Sample Button -->
<button aria-label="Play English sample sound" class="w-12 h-12 rounded-full bg-surface-container-highest text-on-secondary-container flex items-center justify-center active:scale-90 transition-transform shadow-sm" onclick="event.stopPropagation(); playAudioPreview('en')" type="button">
<span class="material-symbols-outlined text-headline-sm" style="font-variation-settings: 'FILL' 1;">campaign</span>
</button>
<!-- Unselected Radio Circle -->
<div class="w-9 h-9 rounded-full bg-surface-container-highest flex items-center justify-center">
<span class="w-3.5 h-3.5 rounded-full bg-outline-variant"></span>
</div>
</div>
</div>
<!-- Tactile Card Footer Note -->

</div>
</div>
<!-- Warm Botanical Illustration Card (Visual Enrichment) -->

<!-- Bottom Navigation Section -->
<div class="mt-space-xl flex flex-col gap-space-sm">
<!-- Crimson Letterpress Stamp 'Continue' Button -->
<button class="w-full h-14 rounded-xl bg-primary-container text-on-primary font-title-md text-title-md flex items-center justify-center gap-space-xs shadow-lg active:translate-y-0.5 active:bg-primary transition-all duration-150" id="btn-continue" type="button">
<span class="">Continue</span>
<span class="material-symbols-outlined text-title-lg">arrow_forward</span>
</button>
<!-- Gentle Quiet 'Back' Action -->
<button class="w-full h-12 rounded-xl text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-space-xs active:bg-surface-container-low transition-colors" id="btn-back" type="button">
<span class="material-symbols-outlined text-label-lg">arrow_back</span>
<span class="">Back</span>
</button>
</div>
</div>
<script>
  // Selection Logic for Accessible Radios
  const cardAs = document.getElementById('lang-as');
  const cardEn = document.getElementById('lang-en');

  function selectLanguage(selected) {
    if (selected === 'as') {
      cardAs.setAttribute('aria-checked', 'true');
      cardAs.className = 'group relative flex flex-col p-space-lg rounded-xl bg-surface-container-lowest shadow-md cursor-pointer transition-all active:scale-[0.99] select-none';
      cardEn.setAttribute('aria-checked', 'false');
      cardEn.className = 'group relative flex flex-col p-space-lg rounded-xl bg-surface-container-low shadow-sm cursor-pointer transition-all active:scale-[0.99] select-none opacity-90';
    } else {
      cardEn.setAttribute('aria-checked', 'true');
      cardEn.className = 'group relative flex flex-col p-space-lg rounded-xl bg-surface-container-lowest shadow-md cursor-pointer transition-all active:scale-[0.99] select-none';
      cardAs.setAttribute('aria-checked', 'false');
      cardAs.className = 'group relative flex flex-col p-space-lg rounded-xl bg-surface-container-low shadow-sm cursor-pointer transition-all active:scale-[0.99] select-none opacity-90';
    }
  }

  cardAs.addEventListener('click', () => selectLanguage('as'));
  cardEn.addEventListener('click', () => selectLanguage('en'));

  // Audio accessibility sample playback micro-feedback
  function playAudioPreview(lang) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const text = lang === 'as' ? 'অসমীয়া ভাষা বাছনি কৰা হৈছে' : 'English language selected';
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'as' ? 'as-IN' : 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  document.getElementById('btn-main-listen').addEventListener('click', () => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance('Please choose your language. Assamese or English.');
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  });
</script></main>

</body></html>
