<script>
  function selectOption(btn) {
    const buttons = document.querySelectorAll('.trivia-btn');

      b.classList.add('bg-surface-container-high', 'text-on-surface');
      const icon = b.querySelector('.check-icon');
      if (icon) icon.classList.add('hidden');
    });
    btn.classList.remove('bg-surface-container-high', 'text-on-surface');
    btn.classList.add('bg-primary-container', 'text-on-primary');

    if (activeIcon) {
      activeIcon.classList.remove('hidden', 'text-outline-variant');

    }
  }

  function playAudioPrompt() {
    const wave = document.getElementById('audio-wave');
    if (wave) {
      wave.classList.toggle('opacity-50');
      setTimeout(() => wave.classList.remove('opacity-50'), 1200);
    }
  }
