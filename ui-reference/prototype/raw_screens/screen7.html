<script>
  (function() {
    const voiceBtn = document.getElementById('voiceReplayBtn');
    if (voiceBtn) {
      voiceBtn.addEventListener('click', function() {
        voiceBtn.classList.add('ring-4', 'ring-[#CE9042]');
        setTimeout(() => {
          voiceBtn.classList.remove('ring-4', 'ring-[#CE9042]');
        }, 1200);
      });
    }

    const playBtn = document.getElementById('playFlowerMatchBtn');
    if (playBtn) {
      playBtn.addEventListener('click', function() {
        playBtn.classList.add('opacity-85');
        setTimeout(() => {
          playBtn.classList.remove('opacity-85');
        }, 250);
      });
    }

    const langToggle = document.getElementById('langToggle');
    if (langToggle) {
      langToggle.addEventListener('click', function() {
        langToggle.textContent = langToggle.textContent.includes('অসমীয়া') ? 'ENG / অসমীয়া' : 'অসমীয়া / EN';
      });
    }
  })();
