<script>
  function selectTheme(themeId) {
    const themes = ['assam', 'manipur', 'meghalaya'];
    
    themes.forEach(theme => {
      const card = document.getElementById('card-' + theme);
      const indicator = document.getElementById('indicator-' + theme);
      
      if (theme === themeId) {
        card.setAttribute('aria-checked', 'true');
        card.className = 'group relative w-full bg-[#FFFDF9] border-[1.5px] border-[#720227] rounded-xl shadow-[0_4px_16px_rgba(114,2,39,0.08)] overflow-hidden transition-all duration-200 cursor-pointer active:scale-[0.99] p-4 pt-4.5';
        indicator.className = 'shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-[#720227] text-white shadow-sm';
      } else {
        card.setAttribute('aria-checked', 'false');
        card.className = 'group relative w-full bg-[#FFFDF9] border-[1.5px] border-[#DECFC0] rounded-xl shadow-[0_2px_10px_rgba(35,27,21,0.04)] overflow-hidden transition-all duration-200 cursor-pointer active:scale-[0.99] p-4 pt-4.5 hover:border-[#CB8067]';
        indicator.className = 'shrink-0 flex items-center justify-center w-8 h-8 rounded-full bg-transparent border-2 border-[#DECFC0] text-transparent';

    });
  }
