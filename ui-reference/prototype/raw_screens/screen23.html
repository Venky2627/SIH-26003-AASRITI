<script>
  (function() {
    // Record toggle micro-interaction
    const recBtn = document.getElementById('recordToggleBtn');
    const recIcon = document.getElementById('recIcon');
    const recLabel = document.getElementById('recLabel');
    let isRecording = true;

    if (recBtn) {
      recBtn.addEventListener('click', function() {
        isRecording = !isRecording;
        if (isRecording) {
          recIcon.textContent = 'mic';
          recLabel.textContent = 'Recording';
          recBtn.classList.remove('bg-secondary');
          recBtn.classList.add('bg-primary-container');
        } else {
          recIcon.textContent = 'pause';
          recLabel.textContent = 'Paused';
          recBtn.classList.remove('bg-primary-container');
          recBtn.classList.add('bg-secondary');
        }
      });
    }

    // Interactive tag chips
    const tagButtons = document.querySelectorAll('#tagList .tag-chip');
    tagButtons.forEach(btn => {
      btn.addEventListener('click', function() {
        const isSelected = this.classList.contains('bg-surface-container-high');
        if (isSelected) {
          this.classList.remove('bg-surface-container-high', 'text-primary-container');
          this.classList.add('bg-surface-container-lowest', 'text-on-surface-variant');
        } else {
          this.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant');
          this.classList.add('bg-surface-container-high', 'text-primary-container');
        }
      });
    });

    // Save action feedback
    const saveBtn = document.getElementById('saveAlbumBtn');
    const toast = document.getElementById('saveToast');
    if (saveBtn && toast) {
      saveBtn.addEventListener('click', function() {
        toast.classList.remove('translate-y-12', 'opacity-0', 'pointer-events-none');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.remove('translate-y-0', 'opacity-100');
          toast.classList.add('translate-y-12', 'opacity-0', 'pointer-events-none');
        }, 3200);
      });
    }

    // Highlight Care Circle navigation tab dynamically
    const navItems = document.querySelectorAll('nav a[data-path="care-circle"]');
    navItems.forEach(item => {
      item.classList.remove('text-on-surface-variant');
      item.classList.add('text-primary-container', 'font-semibold', 'scale-105');
    });
  })();
