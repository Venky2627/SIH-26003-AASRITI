<script>
  (function() {
    const cards = document.querySelectorAll('.opt-card');
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => {
          c.setAttribute('aria-checked', 'false');
          c.className = 'opt-card flex flex-col items-center justify-between p-2.5 rounded-xl bg-surface-container-low text-on-surface shadow-sm transition-transform active:scale-95';
          const badge = c.querySelector('.absolute');
          if (badge) badge.remove();
        });
        
        card.setAttribute('aria-checked', 'true');
        card.className = 'opt-card flex flex-col items-center justify-between p-2.5 rounded-xl bg-primary-container text-on-primary shadow-md relative transition-transform active:scale-95';
        
        const badge = document.createElement('div');
        badge.className = 'absolute -top-2 -right-1 w-6 h-6 rounded-full bg-surface-container-lowest text-primary-container flex items-center justify-center shadow-md';
        badge.innerHTML = '<span class="material-symbols-outlined text-base font-bold">check</span>';
        card.appendChild(badge);
      });
    });

    const voiceBtn = document.getElementById('voiceBtn');
    if (voiceBtn) {
      voiceBtn.addEventListener('click', () => {
        voiceBtn.classList.toggle('bg-secondary-container');
      });
    }
  })();
</script></main>



<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('button, [role="button"]').forEach(function(btn) {
    var txt = btn.textContent.trim();
    if (txt.includes('Same') || txt.includes('Rotated') || txt.includes('Mirror') || txt.includes('Check') || txt.includes('Continue')) {
      btn.addEventListener('click', function() {
        window.AasritiStore.recordGameCompletion('pattern', 90);
        window.navigateToScreen(14);
      });
    } else if (txt.includes('Try Again') || txt.includes('Retry')) {
      btn.addEventListener('click', function() { window.navigateToScreen(13); });
    } else if (txt.includes('Back') || txt.includes('Home')) {
      btn.addEventListener('click', function() { window.navigateToScreen(7); });
    }
  });
  var hback = document.querySelector('header button, [aria-label="Go back"]');
  if (hback) hback.addEventListener('click', function() { window.navigateToScreen(7); });
});
</script>
