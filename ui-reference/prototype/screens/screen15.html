</head><body class="bg-[#FAF4ED] font-body-md text-on-surface flex flex-col min-h-screen antialiased"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-[#FAF4ED]"><div class="flex flex-col w-full min-h-screen bg-[#FAF4ED] pb-6 px-4">
  <!-- Header -->

    </div>
    <div class="flex items-center gap-2">
      <button aria-label="Listen aloud" class="w-9 h-9 rounded-full bg-[#F3E7D7] border border-[#E4D1BA] flex items-center justify-center text-[#720227] active:scale-95 transition-transform shadow-sm" type="button">
        <span class="material-symbols-outlined" style="font-size: 20px;">volume_up</span>
      </button>
      <button aria-label="Language" class="flex items-center gap-1.5 bg-[#F3E7D7] border border-[#E4D1BA] px-3 py-1.5 rounded-full shadow-sm active:scale-95 transition-transform text-[#4b0016]" type="button">

        <span class="material-symbols-outlined text-xs">translate</span>

  <!-- Photo Frame Card with Warm Parchment Border -->
  <div class="bg-[#FFFFFF] border border-[#E8D9C7] rounded-2xl p-2.5 shadow-sm mb-3.5">

      <img class="w-full h-full object-cover" alt="Priya in tea garden" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqPgl7xSPMRg7MGuYNF2TiNltcucfe5OE1FPsfrl4TFz0u1q317GOoakgEWyRTi6acExV7W6B6S9LJkRwxMskEcjcn4i9Ug4Qsn0L6Uz1Pv-hUJPCrmNOBkE_S-p06ornKAEInIS_0k7lInSc6VIF7AL9G1BdZfoKGVR_n7x66AiIS89ZZacKaxSJ0OVLC0YJDhnFyEeLf9V5glch8OvWDEkPuaM5CBUlmOeWqjJCuWMQee8ga3YqJ">
      <div class="absolute bottom-2.5 right-2.5 bg-[#412b22]/70 backdrop-blur-xs rounded-full p-1.5 flex items-center justify-center text-white shadow-sm">
        <span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">favorite</span>

    </div>
    <div class="pt-2.5 pb-1 text-center">
      <h2 class="font-serif text-base font-semibold text-[#4b0016] tracking-tight">Priya's Visit, Guwahati</h2>

  </div>

  <!-- Audio Story Bar -->
  <div class="bg-[#F5ECE0] border border-[#E4D2BF] rounded-2xl p-3 shadow-sm mb-3.5">
    <div class="flex items-center justify-between mb-2">
      <span class="font-serif text-sm font-semibold text-[#4b0016]">Listen to Voice Story</span>
      <span class="text-xs font-semibold text-[#865304]">0:42</span>
    </div>
    <div class="flex items-center gap-3">
      <button aria-label="Play story" class="w-11 h-11 rounded-full bg-[#720227] text-white flex items-center justify-center shadow-md active:scale-95 transition-all flex-shrink-0" id="playBtn" type="button">
        <span class="material-symbols-outlined" id="playIcon" style="font-variation-settings: 'FILL' 1; font-size: 24px;">play_arrow</span>
      </button>
      <div class="flex-1 flex items-center gap-1.5 h-8 px-2.5 bg-[#EDE0D0] rounded-xl overflow-hidden" id="waveform">
        <span class="w-1.5 h-3 bg-[#865304] rounded-full"></span>
        <span class="w-1.5 h-5 bg-[#720227] rounded-full"></span>
        <span class="w-1.5 h-7 bg-[#720227] rounded-full"></span>
        <span class="w-1.5 h-4 bg-[#865304] rounded-full"></span>
        <span class="w-1.5 h-6 bg-[#720227] rounded-full"></span>

        <span class="w-1.5 h-5 bg-[#865304] rounded-full"></span>
        <span class="w-1.5 h-2 bg-[#865304] rounded-full"></span>
        <span class="w-1.5 h-4 bg-[#865304] rounded-full"></span>
        <span class="w-1.5 h-6 bg-[#720227] rounded-full"></span>

  </div>

  <!-- Primary Deep Wine Red Next Button -->
  <button class="w-full min-h-[52px] bg-[#720227] hover:bg-[#5a011f] text-white rounded-2xl font-serif text-base font-semibold flex items-center justify-center gap-2 shadow-md active:translate-y-0.5 transition-all mb-4" type="button">
    <span class="">Next Memory</span>
    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>

  <!-- Bottom Archival Navigation Bar -->
  <nav class="mt-auto bg-[#F3E7D7] border border-[#E3D1BB] rounded-2xl px-4 py-2 shadow-sm flex items-center justify-around">
    <button class="flex flex-col items-center gap-0.5 py-1 text-[#574144] active:scale-95 transition-transform" type="button">
      <span class="material-symbols-outlined" style="font-size: 22px;">today</span>
      <span class="text-[11px] font-medium">Today</span>
    </button>
    <button class="flex flex-col items-center gap-0.5 py-1 px-3.5 rounded-xl bg-[#720227] text-white shadow-sm" type="button">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 22px;">photo_library</span>

<script>
  (function() {
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    let isPlaying = false;
    
    if (playBtn && playIcon) {
      playBtn.addEventListener('click', function() {
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? 'pause' : 'play_arrow';
      });
    }
  })();
</script></main>



<script>
document.addEventListener('DOMContentLoaded', function() {
  // Memory cards - internal interaction
  document.querySelectorAll('main .rounded-xl, main .rounded-2xl, main [class*="card"]').forEach(function(c) {
    c.style.cursor = 'pointer';
    c.addEventListener('click', function(e) {
      if (!e.target.closest('button')) {
        window.showToast('Memory playing: Archival family recording', 'info');
      }
    });
  });
  document.querySelectorAll('button').forEach(function(btn) {
    var txt = btn.textContent.trim();
    if (txt.includes('Save')) {
      btn.addEventListener('click', function() { window.showToast('Memory Album saved', 'success'); });
    } else if (txt.includes('Back') || txt.includes('Home')) {
      btn.addEventListener('click', function() { window.navigateToScreen(7); });
    }
  });
  var hback = document.querySelector('header button, [aria-label="Go back"]');
  if (hback) hback.addEventListener('click', function() { window.navigateToScreen(7); });
});
</script>
</body></html>
