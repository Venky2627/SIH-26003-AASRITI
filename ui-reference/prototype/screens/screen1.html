<script>
  function toggleLanguage(lang) {
    const engBtn = document.getElementById('lang-eng');
    const asBtn = document.getElementById('lang-as');
    
    if (lang === 'as') {
      asBtn.className = 'px-4 py-1.5 rounded-full bg-[#720227] text-[#FAF4ED] font-label-md text-label-md shadow-sm transition-all';
      asBtn.setAttribute('aria-checked', 'true');
      engBtn.className = 'px-4 py-1.5 rounded-full text-[#574144] font-label-md text-label-md transition-all hover:text-[#2A1D15]';
      engBtn.setAttribute('aria-checked', 'false');
    } else {
      engBtn.className = 'px-4 py-1.5 rounded-full bg-[#720227] text-[#FAF4ED] font-label-md text-label-md shadow-sm transition-all';
      engBtn.setAttribute('aria-checked', 'true');
      asBtn.className = 'px-4 py-1.5 rounded-full text-[#574144] font-label-md text-label-md transition-all hover:text-[#2A1D15]';
      asBtn.setAttribute('aria-checked', 'false');
    }
  }
</script></main>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // ENTER button (first button in the page that has crimson bg)
  var allBtns = document.querySelectorAll('button[type="button"]');
  allBtns.forEach(function(btn) {
    var text = btn.textContent.trim();
    if (text.includes('ENTER') || btn.classList.contains('bg-\\[\\#720227\\]') || btn.style.backgroundColor) {
      // Use first match that says ENTER
    }
  });
  
  // Find ENTER button by text content
  document.querySelectorAll('button').forEach(function(btn) {
    var txt = btn.textContent.trim();
    if (txt.includes('ENTER')) {
      btn.style.cursor = 'pointer';
      btn.addEventListener('click', function() {
          window.AasritiStore.setRole('patient');
          window.navigateToScreen(3);
        });
      } else if (txt.includes('ASHA') || txt.includes('Caregiver')) {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function() {
          window.AasritiStore.setRole('caregiver');
          window.navigateToScreen(3);
        });
      } else if (txt.includes('Doctor')) {
        btn.style.cursor = 'pointer';
        btn.addEventListener('click', function() {
          window.AasritiStore.setRole('doctor');
          window.navigateToScreen(3);
        });
      }
  });

  // Language pill area -> Screen 4
  var langArea = document.querySelector('[aria-label="Language selection"]');
  if (langArea) {
    langArea.style.cursor = 'pointer';
    langArea.addEventListener('click', function() { window.navigateToScreen(4); });
  }
});
</script>
